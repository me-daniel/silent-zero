<svg xmlns="http://www.w3.org/2000/svg" width="860" height="432" viewBox="0 0 860 432" role="img" aria-labelledby="t d">
<title id="t">One missing token, one lost call</title>
<desc id="d">A quantized model writes a tool call but ends its turn before the closing tag. BFCL's regex does not match, so the call is dropped and scored as no call. With the patch's opt-in tolerant mode the call is kept. The IQ3_XXS simple_python score is 65.8, and 91.0 once the missing tag is tolerated, against 95.5 for Q8_0.</desc>
<defs><clipPath id="code"><rect x="29" y="113" width="402" height="148" rx="8"/></clipPath></defs>
