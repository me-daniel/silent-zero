caleX(1);opacity:0}}.gbase{transform-box:fill-box;transform-origin:left center;animation:gbase 16.0s cubic-bezier(.3,.7,.4,1) infinite both}@keyframes ref{0%,57.50%{opacity:0}59.69%,94%{opacity:1}98%,100%{opacity:0}}.ref{animation:ref 16.0s linear infinite both}@keyframes l1{0%,66.25%{opacity:0}68.44%,94%{opacity:1}98%,100%{opacity:0}}.l1{animation:l1 16.0s linear infinite both}@keyframes l2{0%,76.25%{opacity:0}78.44%,94%{opacity:1}98%,100%{opacity:0}}.l2{animation:l2 16.0s linear infinite both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
